<svg viewBox="0 0 920 540" xmlns="http://www.w3.org/2000/svg" width="920" role="img"><title>A prompt enters a stateless completion box that cannot write back to the world</title><g><rect x="40" y="220" width="140" height="70" rx="10" fill="#d9e4ee" stroke="#355065" stroke-width="1.6"></rect><text x="50" y="236" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#355065">USER</text><text x="50" y="254" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Prompt in</text></g><rect x="210" y="70" width="430" height="380" rx="22" fill="#fff8ef" stroke="#c45c26" stroke-width="2.4"></rect><text x="230" y="100" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#8a3a14">COMPLETION BOX · stateless product boundary</text><g><rect x="250" y="130" width="350" height="70" rx="10" fill="#f6e3c4" stroke="#c9842a" stroke-width="1.6"></rect><text x="260" y="146" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#c9842a">CTX</text><text x="260" y="164" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Context window = volatile RAM</text></g><g><rect x="250" y="230" width="350" height="70" rx="10" fill="#f8e1a8" stroke="#8a3a14" stroke-width="1.6"></rect><text x="260" y="246" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#8a3a14">BOX</text><text x="260" y="264" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">p(next token | prefix)</text></g><g><rect x="250" y="330" width="350" height="70" rx="10" fill="#f6e3c4" stroke="#c9842a" stroke-width="1.6"></rect><text x="260" y="346" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#c9842a">OUT</text><text x="260" y="364" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Completion text out</text></g><path d="M180 255h70" stroke="#355065" stroke-width="1.8"></path><path d="M425 200v30" stroke="#c9842a" stroke-width="1.6"></path><path d="M425 300v30" stroke="#c9842a" stroke-width="1.6"></path><g><rect x="690" y="90" width="200" height="80" rx="10" fill="#d7ecea" stroke="#1f6b68" stroke-width="1.6"></rect><text x="700" y="106" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#1f6b68">WORLD</text><text x="700" y="124" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Files, APIs, calendars, prod</text></g><g><rect x="690" y="210" width="200" height="80" rx="10" fill="#eee7dc" stroke="#4a4036" stroke-width="1.6"></rect><text x="700" y="226" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#4a4036">MEM</text><text x="700" y="244" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Persistent memory (absent)</text></g><g><rect x="690" y="340" width="200" height="90" rx="10" fill="#f4c7c2" stroke="#b42318" stroke-width="1.6"></rect><text x="700" y="356" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#b42318">GAP</text><text x="700" y="374" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">No write-back arrow</text></g><path d="M640 365h50" stroke="#b42318" stroke-width="2" stroke-dasharray="6 6"></path><text x="640" y="400" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#b42318">dashed = missing edge</text><path d="M640 170h50" stroke="#1f6b68" stroke-width="1.5" stroke-dasharray="5 5"></path><text x="640" y="160" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#1f6b68">world is readable only if pasted</text><text x="230" y="430" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#8a3a14">Session ends → CTX evaporates. BOX cannot keep a promise.</text></svg>