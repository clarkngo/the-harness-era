<svg viewBox="0 0 920 500" xmlns="http://www.w3.org/2000/svg" width="920" role="img"><title>ReAct loop cycling thought, action, tool, and observation until stop</title><g><rect x="80" y="40" width="200" height="70" rx="10" fill="#d9e4ee" stroke="#355065" stroke-width="1.6"></rect><text x="90" y="56" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#355065">GOAL</text><text x="90" y="74" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">User task</text></g><g><rect x="360" y="40" width="220" height="70" rx="10" fill="#f6e3c4" stroke="#c9842a" stroke-width="1.6"></rect><text x="370" y="56" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#c9842a">THOUGHT</text><text x="370" y="74" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Reason about next step</text></g><g><rect x="660" y="40" width="200" height="70" rx="10" fill="#d9e4ee" stroke="#355065" stroke-width="1.6"></rect><text x="670" y="56" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#355065">ACTION</text><text x="670" y="74" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Structured tool call</text></g><g><rect x="660" y="200" width="200" height="80" rx="10" fill="#d7ecea" stroke="#1f6b68" stroke-width="1.6"></rect><text x="670" y="216" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#1f6b68">TOOL</text><text x="670" y="234" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Search / code / API</text></g><g><rect x="360" y="200" width="220" height="80" rx="10" fill="#d7ecea" stroke="#1f6b68" stroke-width="1.6"></rect><text x="370" y="216" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#1f6b68">OBS</text><text x="370" y="234" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Observation text in CTX</text></g><g><rect x="360" y="360" width="220" height="70" rx="10" fill="#cfe3c8" stroke="#2f6f3e" stroke-width="1.6"></rect><text x="370" y="376" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#2f6f3e">STOP</text><text x="370" y="394" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Final answer</text></g><g><rect x="80" y="200" width="200" height="80" rx="10" fill="#f8e1a8" stroke="#8a3a14" stroke-width="1.6"></rect><text x="90" y="216" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#8a3a14">LOOP</text><text x="90" y="234" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Trace appends; repeat</text></g><path d="M280 75h80" stroke="#355065" stroke-width="1.7"></path><path d="M580 75h80" stroke="#c9842a" stroke-width="1.7"></path><path d="M760 110v90" stroke="#355065" stroke-width="1.7"></path><path d="M660 240h-80" stroke="#1f6b68" stroke-width="1.7"></path><path d="M360 240h-80" stroke="#1f6b68" stroke-width="1.7"></path><path d="M180 200v-90" stroke="#8a3a14" stroke-width="1.7"></path><path d="M470 280v80" stroke="#2f6f3e" stroke-width="1.7" stroke-dasharray="6 5"></path><text x="490" y="330" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#2f6f3e">halt predicate</text><text x="80" y="430" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#4a4036">Thought is private scratch. Action is the only thing the world can hear.</text><text x="80" y="450" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#4a4036">Without a halt predicate, LOOP is a furnace. Chapter 5 lights it.</text></svg>