<svg viewBox="0 0 920 560" xmlns="http://www.w3.org/2000/svg" width="920" role="img"><title>Orchestrator harness over specialist agents, a bus, security boundary, and human accountability</title><g><rect x="40" y="30" width="260" height="70" rx="10" fill="#f4c7c2" stroke="#b42318" stroke-width="1.6"></rect><text x="50" y="46" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#b42318">HUMAN</text><text x="50" y="64" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Accountability plane</text></g><g><rect x="330" y="30" width="260" height="70" rx="10" fill="#f6e3c4" stroke="#c9842a" stroke-width="1.6"></rect><text x="340" y="46" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#c9842a">ORCH</text><text x="340" y="64" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Orchestrator harness</text></g><g><rect x="620" y="30" width="260" height="70" rx="10" fill="#d9e4ee" stroke="#355065" stroke-width="1.6"></rect><text x="630" y="46" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#355065">AUDIT</text><text x="630" y="64" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Audit / traces / spend</text></g><path d="M300 65h30" stroke="#b42318" stroke-width="1.6"></path><path d="M590 65h30" stroke="#355065" stroke-width="1.6"></path><rect x="40" y="130" width="840" height="70" rx="14" fill="#d9e4ee" stroke="#355065"></rect><text x="58" y="158" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#355065">BUS</text><text x="58" y="180" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Event / message bus · contracts, not vibes</text><path d="M460 100v30" stroke="#c9842a" stroke-width="1.6"></path><g><rect x="40" y="230" width="250" height="90" rx="10" fill="#d7ecea" stroke="#1f6b68" stroke-width="1.6"></rect><text x="50" y="246" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#1f6b68">A1</text><text x="50" y="264" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Code harness + sandbox</text></g><g><rect x="335" y="230" width="250" height="90" rx="10" fill="#d7ecea" stroke="#1f6b68" stroke-width="1.6"></rect><text x="345" y="246" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#1f6b68">A2</text><text x="345" y="264" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Research harness + RAG</text></g><g><rect x="630" y="230" width="250" height="90" rx="10" fill="#d7ecea" stroke="#1f6b68" stroke-width="1.6"></rect><text x="640" y="246" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#1f6b68">A3</text><text x="640" y="264" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Ops harness + runbooks</text></g><path d="M165 200v30" stroke="#1f6b68" stroke-width="1.5"></path><path d="M460 200v30" stroke="#1f6b68" stroke-width="1.5"></path><path d="M755 200v30" stroke="#1f6b68" stroke-width="1.5"></path><rect x="40" y="350" width="840" height="90" rx="16" fill="#f4c7c2" stroke="#b42318" stroke-dasharray="7 5"></rect><text x="58" y="384" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#b42318">SEC</text><text x="58" y="410" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Security boundary · identity, egress, secrets, blast radius per harness</text><text x="40" y="480" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#4a4036">Swarm-without-SEC is a lateral-movement product. Hierarchy-without-HUMAN is a scapegoat generator.</text><text x="40" y="504" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#8a3a14">Each A_* is a microservice with its own MODEL, STATE, SAND, and BRK — not a prompt with a name.</text><text x="40" y="538" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#b42318">ORCH may delegate work. It may not delegate liability.</text></svg>