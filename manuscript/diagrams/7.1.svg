roke-width="1.6"></path><path d="M160 170v50" stroke="#355065" stroke-width="1.6"></path><path d="M400 170v50" stroke="#355065" stroke-width="1.6"></path><path d="M740 170v50" stroke="#1f6b68" stroke-width="1.6"></path><path d="M250 310v50" stroke="#1f6b68" stroke-width="1.6"></path><path d="M740 310v50" stroke="#1f6b68" stroke-width="1.6"></path><path d="M440 405h40" stroke="#2f6f3e" stroke-width="1.6"></path><text x="60" y="490" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#4a4036">Agent = MODEL + (STATE + CTX + SAND + TOOLS + LOOP + BRK + POLICY)</text><text x="60" y="512" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#8a3a14">* WORLD is reachable only through SAND and POLICY. That is the whole plot.</text></svg>