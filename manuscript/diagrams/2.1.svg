<svg viewBox="0 0 920 540" xmlns="http://www.w3.org/2000/svg" width="920" role="img"><title>Tokens become vectors, split across attention heads, then stop at representation with no executor</title><g><rect x="40" y="40" width="150" height="70" rx="10" fill="#d9e4ee" stroke="#355065" stroke-width="1.6"></rect><text x="50" y="56" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#355065">TOK</text><text x="50" y="74" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Token sequence</text></g><g><rect x="230" y="40" width="180" height="70" rx="10" fill="#d9e4ee" stroke="#355065" stroke-width="1.6"></rect><text x="240" y="56" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#355065">EMB</text><text x="240" y="74" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">x ∈ R^{n×d}</text></g><g><rect x="450" y="24" width="120" height="48" rx="10" fill="#f6e3c4" stroke="#c9842a" stroke-width="1.6"></rect><text x="460" y="40" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#c9842a">Q</text><text x="460" y="58" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Query</text></g><g><rect x="450" y="80" width="120" height="48" rx="10" fill="#f6e3c4" stroke="#c9842a" stroke-width="1.6"></rect><text x="460" y="96" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#c9842a">K</text><text x="460" y="114" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Key</text></g><g><rect x="450" y="136" width="120" height="48" rx="10" fill="#f6e3c4" stroke="#c9842a" stroke-width="1.6"></rect><text x="460" y="152" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#c9842a">V</text><text x="460" y="170" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Value</text></g><path d="M190 75h40" stroke="#355065" stroke-width="1.6"></path><path d="M410 75h40" stroke="#355065" stroke-width="1.6"></path><path d="M410 75c20 0 28 20 40 45" fill="none" stroke="#355065" stroke-width="1.4"></path><path d="M410 75c20 40 28 70 40 85" fill="none" stroke="#355065" stroke-width="1.4"></path><g><rect x="610" y="40" width="130" height="58" rx="10" fill="#f8e1a8" stroke="#c9842a" stroke-width="1.6"></rect><text x="620" y="56" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#c9842a">HEAD_1</text><text x="620" y="74" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Head 1</text></g><g><rect x="610" y="112" width="130" height="58" rx="10" fill="#f8e1a8" stroke="#c9842a" stroke-width="1.6"></rect><text x="620" y="128" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#c9842a">HEAD_h</text><text x="620" y="146" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Head h</text></g><g><rect x="770" y="76" width="120" height="58" rx="10" fill="#f6e3c4" stroke="#8a3a14" stroke-width="1.6"></rect><text x="780" y="92" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#8a3a14">SOFT</text><text x="780" y="110" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">softmax(QKᵀ/√d)</text></g><path d="M570 48h40" stroke="#c9842a" stroke-width="1.5"></path><path d="M570 160h40v-20" fill="none" stroke="#c9842a" stroke-width="1.5"></path><path d="M740 69h30" stroke="#c9842a" stroke-width="1.5"></path><path d="M740 141h30v-20" fill="none" stroke="#c9842a" stroke-width="1.5"></path><g><rect x="230" y="230" width="200" height="62" rx="10" fill="#d7ecea" stroke="#1f6b68" stroke-width="1.6"></rect><text x="240" y="246" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#1f6b68">CONCAT</text><text x="240" y="264" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Concat + W_o projection</text></g><g><rect x="470" y="230" width="220" height="62" rx="10" fill="#d7ecea" stroke="#1f6b68" stroke-width="1.6"></rect><text x="480" y="246" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#1f6b68">CTX</text><text x="480" y="264" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Contextual vectors h ∈ R^{n×d}</text></g><g><rect x="730" y="230" width="160" height="62" rx="10" fill="#d9e4ee" stroke="#355065" stroke-width="1.6"></rect><text x="740" y="246" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#355065">LM</text><text x="740" y="264" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Next-token logits</text></g><path d="M830 134v96" stroke="#1f6b68" stroke-width="1.6"></path><path d="M430 261h40" stroke="#1f6b68" stroke-width="1.6"></path><path d="M690 261h40" stroke="#355065" stroke-width="1.6"></path><rect x="40" y="340" width="540" height="160" rx="14" fill="#f7f2ea" stroke="#1f6b68"></rect><text x="58" y="370" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#154f4d">What the renaissance actually bought</text><text x="58" y="396" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#4a4036">Attention is a soft routing function over vectors, not a program counter.</text><text x="58" y="416" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#4a4036">HEAD_1 .. HEAD_h specialize subspaces; CONCAT mixes them back.</text><text x="58" y="436" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#4a4036">CTX is a high-dimensional map of the prompt, not a store of world facts.</text><text x="58" y="468" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#1f6b68">Intelligence here means better geometry, not a runtime.</text><g><rect x="610" y="360" width="280" height="120" rx="14" fill="#f4c7c2" stroke="#b42318" stroke-width="1.6"></rect><text x="620" y="376" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#b42318">GAP</text><text x="620" y="394" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">No executor, no tools, no world write</text></g><text x="628" y="430" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#b42318">LM stops at text. Action is still a human&#x27;s job.</text></svg>