<svg viewBox="0 0 920 520" xmlns="http://www.w3.org/2000/svg" width="920" role="img"><title>MCP host wrapping a model, a client, and multiple tool servers</title><rect x="40" y="40" width="840" height="200" rx="20" fill="#fff8ef" stroke="#c45c26" stroke-width="2"></rect><text x="60" y="70" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#8a3a14">MCP HOST · the application that owns the session</text><g><rect x="70" y="100" width="220" height="90" rx="10" fill="#f6e3c4" stroke="#c9842a" stroke-width="1.6"></rect><text x="80" y="116" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#c9842a">MODEL</text><text x="80" y="134" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Weights / chat runtime</text></g><g><rect x="350" y="100" width="240" height="90" rx="10" fill="#d9e4ee" stroke="#355065" stroke-width="1.6"></rect><text x="360" y="116" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#355065">CLIENT</text><text x="360" y="134" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">MCP client (1:N servers)</text></g><g><rect x="640" y="100" width="200" height="90" rx="10" fill="#f8e1a8" stroke="#8a3a14" stroke-width="1.6"></rect><text x="650" y="116" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#8a3a14">POLICY</text><text x="650" y="134" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Consent, scopes, UX</text></g><path d="M290 145h60" stroke="#c9842a" stroke-width="1.7"></path><path d="M590 145h50" stroke="#355065" stroke-width="1.7"></path><text x="40" y="280" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#154f4d">MCP SERVERS · tool providers, reusable across hosts</text><g><rect x="40" y="300" width="250" height="90" rx="10" fill="#d7ecea" stroke="#1f6b68" stroke-width="1.6"></rect><text x="50" y="316" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#1f6b68">SERVER_A</text><text x="50" y="334" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">stdio · filesystem</text></g><g><rect x="335" y="300" width="250" height="90" rx="10" fill="#d7ecea" stroke="#1f6b68" stroke-width="1.6"></rect><text x="345" y="316" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#1f6b68">SERVER_B</text><text x="345" y="334" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">SSE · SaaS / browser</text></g><g><rect x="630" y="300" width="250" height="90" rx="10" fill="#d7ecea" stroke="#1f6b68" stroke-width="1.6"></rect><text x="640" y="316" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#1f6b68">SERVER_C</text><text x="640" y="334" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">HTTP · internal APIs</text></g><path d="M470 190v110" stroke="#355065" stroke-width="1.7"></path><path d="M165 300v-40h305" fill="none" stroke="#1f6b68" stroke-width="1.5"></path><path d="M755 300v-40h-285" fill="none" stroke="#1f6b68" stroke-width="1.5"></path><text x="40" y="430" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#4a4036">Transport is not the product. The product is a shared schema for tools, resources, and prompts.</text><text x="40" y="454" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#4a4036">HOST speaks MODEL. CLIENT speaks SERVER_*. Neither hard-codes the other&#x27;s vendor dialect.</text><text x="40" y="488" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#8a3a14">Fragmentation moves from adapters in app code to optional servers at the edge.</text></svg>