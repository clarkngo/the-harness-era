<svg viewBox="0 0 920 520" xmlns="http://www.w3.org/2000/svg" width="920" role="img"><title>A shallow decision tree on the left versus an exploding rule-engine state space on the right</title><text x="40" y="28" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#154f4d">Bounded decision tree</text><text x="500" y="28" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#8a3a14">Rule engine with M predicates</text><g><rect x="160" y="50" width="150" height="52" rx="10" fill="#d7ecea" stroke="#1f6b68" stroke-width="1.6"></rect><text x="170" y="66" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#1f6b68">T_ROOT</text><text x="170" y="84" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Symptom present?</text></g><g><rect x="70" y="150" width="140" height="52" rx="10" fill="#d7ecea" stroke="#1f6b68" stroke-width="1.6"></rect><text x="80" y="166" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#1f6b68">T_FEVER</text><text x="80" y="184" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Fever &gt; 38°C?</text></g><g><rect x="260" y="150" width="150" height="52" rx="10" fill="#d7ecea" stroke="#1f6b68" stroke-width="1.6"></rect><text x="270" y="166" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#1f6b68">T_BIRD</text><text x="270" y="184" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Bird exposure?</text></g><g><rect x="150" y="260" width="170" height="52" rx="10" fill="#cfe3c8" stroke="#2f6f3e" stroke-width="1.6"></rect><text x="160" y="276" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#2f6f3e">T_LEAF</text><text x="160" y="294" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Emit treatment</text></g><path d="M235 102v48" stroke="#1f6b68" stroke-width="1.6" marker-end="url(#arrow)"></path><path d="M200 102c-50 18-70 30-70 48" fill="none" stroke="#1f6b68" stroke-width="1.6"></path><path d="M270 102c50 18 70 30 70 48" fill="none" stroke="#1f6b68" stroke-width="1.6"></path><path d="M140 202v58h50" fill="none" stroke="#1f6b68" stroke-width="1.6"></path><path d="M335 202v28c0 30-20 30-40 30" fill="none" stroke="#1f6b68" stroke-width="1.6"></path><g><rect x="500" y="50" width="170" height="52" rx="10" fill="#f6d6c8" stroke="#8a3a14" stroke-width="1.6"></rect><text x="510" y="66" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#8a3a14">R_KB</text><text x="510" y="84" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Knowledge base, N rules</text></g><g><rect x="720" y="50" width="170" height="52" rx="10" fill="#f6d6c8" stroke="#8a3a14" stroke-width="1.6"></rect><text x="730" y="66" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#8a3a14">R_FACTS</text><text x="730" y="84" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Fact vector, M bits</text></g><g><rect x="610" y="150" width="180" height="52" rx="10" fill="#f6d6c8" stroke="#8a3a14" stroke-width="1.6"></rect><text x="620" y="166" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#8a3a14">R_WM</text><text x="620" y="184" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Working memory match</text></g><g><rect x="500" y="260" width="190" height="58" rx="10" fill="#f8e1a8" stroke="#c9842a" stroke-width="1.6"></rect><text x="510" y="276" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#c9842a">R_COMB</text><text x="510" y="294" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">|States| ≈ 2^M</text></g><g><rect x="720" y="260" width="170" height="58" rx="10" fill="#f4c7c2" stroke="#b42318" stroke-width="1.6"></rect><text x="730" y="276" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#b42318">R_FAIL</text><text x="730" y="294" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">No rule fires / clash</text></g><path d="M585 102v48h40" fill="none" stroke="#8a3a14" stroke-width="1.6"></path><path d="M805 102v48h-40" fill="none" stroke="#8a3a14" stroke-width="1.6"></path><path d="M700 202v58" stroke="#c9842a" stroke-width="1.6"></path><path d="M790 202v58" stroke="#b42318" stroke-width="1.6"></path><rect x="40" y="360" width="400" height="130" rx="14" fill="#f7f2ea" stroke="#1f6b68"></rect><text x="58" y="388" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#154f4d">Tree growth is local</text><text x="58" y="412" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#4a4036">Adding a predicate adds a branch, not a universe.</text><text x="58" y="432" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#4a4036">Unseen combinations fall off the leaf set.</text><text x="58" y="462" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#1f6b68">Adaptability: zero. Coverage: whatever you drew.</text><rect x="470" y="360" width="420" height="130" rx="14" fill="#fbf1ea" stroke="#8a3a14"></rect><text x="488" y="388" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#8a3a14">Rule growth is combinatorial</text><text x="488" y="412" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#4a4036">Each new predicate doubles the reachable working-memory states.</text><text x="488" y="432" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#4a4036">Overlapping rules create contradictions instead of learning.</text><text x="488" y="462" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#b42318">R_FAIL is not an exception. It is the default for novelty.</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#1f6b68"></path></marker></defs></svg>