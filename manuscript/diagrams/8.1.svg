<svg viewBox="0 0 920 520" xmlns="http://www.w3.org/2000/svg" width="920" role="img"><title>A patch passing a deterministic linter gate then a non-deterministic LLM judge</title><g><rect x="40" y="40" width="200" height="70" rx="10" fill="#eee7dc" stroke="#4a4036" stroke-width="1.6"></rect><text x="50" y="56" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#4a4036">PATCH</text><text x="50" y="74" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Proposed change</text></g><g><rect x="300" y="40" width="280" height="70" rx="10" fill="#d9e4ee" stroke="#355065" stroke-width="1.6"></rect><text x="310" y="56" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#355065">LINT</text><text x="310" y="74" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Types, tests, static analysis</text></g><g><rect x="640" y="20" width="240" height="50" rx="10" fill="#f4c7c2" stroke="#b42318" stroke-width="1.6"></rect><text x="650" y="36" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#b42318">FAIL_D</text><text x="650" y="54" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Deterministic reject</text></g><g><rect x="300" y="180" width="280" height="80" rx="10" fill="#f6e3c4" stroke="#c9842a" stroke-width="1.6"></rect><text x="310" y="196" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#c9842a">JUDGE</text><text x="310" y="214" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">LLM-as-judge / rubric</text></g><g><rect x="640" y="160" width="240" height="50" rx="10" fill="#f8e1a8" stroke="#8a3a14" stroke-width="1.6"></rect><text x="650" y="176" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#8a3a14">FAIL_N</text><text x="650" y="194" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Sensor reject / retry</text></g><g><rect x="300" y="330" width="280" height="70" rx="10" fill="#cfe3c8" stroke="#2f6f3e" stroke-width="1.6"></rect><text x="310" y="346" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#2f6f3e">MERGE</text><text x="310" y="364" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Accept into runtime</text></g><g><rect x="640" y="320" width="240" height="80" rx="10" fill="#f4c7c2" stroke="#b42318" stroke-width="1.6"></rect><text x="650" y="336" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#b42318">HUMAN</text><text x="650" y="354" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Escalation plane</text></g><path d="M240 75h60" stroke="#355065" stroke-width="1.7"></path><path d="M580 55h60" stroke="#b42318" stroke-width="1.7"></path><path d="M440 110v70" stroke="#c9842a" stroke-width="1.7"></path><path d="M580 210h60" stroke="#c9842a" stroke-width="1.7"></path><path d="M440 260v70" stroke="#2f6f3e" stroke-width="1.7"></path><path d="M760 210v110" stroke="#b42318" stroke-width="1.6"></path><path d="M760 70v90" stroke="#b42318" stroke-width="1.4" stroke-dasharray="5 5"></path><text x="40" y="150" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#355065">Layer A · cheap, repeatable, no vibes</text><text x="40" y="290" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#c9842a">Layer B · expensive, fuzzy, catches what types cannot</text><text x="40" y="440" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#4a4036">Prompt-only safety skips LINT and pretends JUDGE is a compiler.</text><text x="40" y="464" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#8a3a14">Harness engineering is the order: LINT first, JUDGE second, HUMAN last.</text><text x="40" y="498" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#b42318">Never invert the layers. A kind model cannot un-delete production.</text></svg>