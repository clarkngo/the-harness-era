<svg viewBox="0 0 920 520" xmlns="http://www.w3.org/2000/svg" width="920" role="img"><title>Planner, executor, and critic cycle with no halt into a token-burn sink</title><g><rect x="360" y="20" width="200" height="60" rx="10" fill="#d9e4ee" stroke="#355065" stroke-width="1.6"></rect><text x="370" y="36" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#355065">GOAL</text><text x="370" y="54" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">User goal (vague)</text></g><g><rect x="80" y="140" width="200" height="70" rx="10" fill="#f6e3c4" stroke="#c9842a" stroke-width="1.6"></rect><text x="90" y="156" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#c9842a">PLAN</text><text x="90" y="174" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Planner: more steps</text></g><g><rect x="360" y="140" width="200" height="70" rx="10" fill="#f6e3c4" stroke="#c9842a" stroke-width="1.6"></rect><text x="370" y="156" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#c9842a">EXEC</text><text x="370" y="174" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Executor: try something</text></g><g><rect x="640" y="140" width="200" height="70" rx="10" fill="#f6e3c4" stroke="#c9842a" stroke-width="1.6"></rect><text x="650" y="156" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#c9842a">CRITIC</text><text x="650" y="174" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Critic: not done yet</text></g><g><rect x="360" y="280" width="200" height="70" rx="10" fill="#f8e1a8" stroke="#8a3a14" stroke-width="1.6"></rect><text x="370" y="296" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#8a3a14">REPLAN</text><text x="370" y="314" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Replan from scratch</text></g><g><rect x="80" y="390" width="280" height="80" rx="10" fill="#f4c7c2" stroke="#b42318" stroke-width="1.6"></rect><text x="90" y="406" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#b42318">SINK</text><text x="90" y="424" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Unconstrained recursion</text></g><g><rect x="400" y="390" width="200" height="80" rx="10" fill="#f4c7c2" stroke="#b42318" stroke-width="1.6"></rect><text x="410" y="406" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#b42318">COST</text><text x="410" y="424" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Tokens × price × time</text></g><g><rect x="640" y="390" width="200" height="80" rx="10" fill="#eee7dc" stroke="#4a4036" stroke-width="1.6"></rect><text x="650" y="406" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#4a4036">HALT</text><text x="650" y="424" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#1c1612">Halt / budget (missing)</text></g><path d="M460 80v60" stroke="#355065" stroke-width="1.6"></path><path d="M280 175h80" stroke="#c9842a" stroke-width="1.6"></path><path d="M560 175h80" stroke="#c9842a" stroke-width="1.6"></path><path d="M740 210v90c0 20-80 40-180 40" fill="none" stroke="#8a3a14" stroke-width="1.6"></path><path d="M180 210v90c0 20 80 40 180 40" fill="none" stroke="#8a3a14" stroke-width="1.6"></path><path d="M460 350v40" stroke="#b42318" stroke-width="1.8"></path><path d="M220 350v40" stroke="#b42318" stroke-width="1.8"></path><path d="M740 210v180" stroke="#4a4036" stroke-width="1.4" stroke-dasharray="6 6"></path><text x="80" y="40" font-family="Figtree, Helvetica, sans-serif" font-size="11" font-weight="650" fill="#b42318">No circuit breaker on LOOP</text><text x="80" y="62" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#4a4036">Each hop is locally reasonable. The cycle is globally bankrupt.</text><text x="80" y="500" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" fill="#b42318">SINK wins whenever HALT is a prompt instead of a counter.</text></svg>